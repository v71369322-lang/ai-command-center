[project]
name = "ai-command-center"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "redis>=5,<7", "cryptography>=44", "httpx>=0.28,<1"]
[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8,<9",
    "pytest-cov>=6",
    "ruff>=0.11",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/command_center"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
