name: VPS preparation offline checks
on:
  pull_request:
    paths:
      - 'infra/vps/**'
      - 'docs/infrastructure/**'
      - '.github/workflows/vps-preparation.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline infrastructure checks after locked dependency setup
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen
          .venv/bin/ruff check infra/vps
          .venv/bin/python -m pytest infra/vps/tests -q
          .venv/bin/python infra/vps/validate.py infra/vps/compose.control-plane.json
          .venv/bin/python infra/vps/read_only_probe.py --files-only > /tmp/cloud-inventory.json
          git diff --exit-code
