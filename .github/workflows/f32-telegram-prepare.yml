name: F32 one-shot VPS release preparation
on:
  push:
    branches: [ops/f32-telegram-prepare]
permissions:
  contents: read
concurrency:
  group: f32-password-prepare
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: operations
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 316dc1615dea224bcf4bd595d87048d19820bd21
          fetch-depth: 0
          persist-credentials: false
          path: approved-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify consolidated source and preparation helpers without VPS access
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.23
          cd approved-source
          uv sync --frozen
          export F32_SOURCE_REPOSITORY="$PWD"
          .venv/bin/ruff check ../operations/infra/vps/f32 ../operations/infra/vps/tests/test_f32*.py
          .venv/bin/pytest ../operations/infra/vps/tests/test_f32*.py -q
          python ../operations/infra/vps/f32/verify_release.py --source "$PWD"
          for file in ../operations/infra/vps/f32/*.sh; do bash -n "$file"; done
  prepare:
    needs: verify
    if: contains(github.event.head_commit.message, '[run-f32]')
    runs-on: [acc-bootstrap-only]
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: operations
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 316dc1615dea224bcf4bd595d87048d19820bd21
          persist-credentials: false
          path: approved-source
      - name: Stage non-secret source and wait for administrator handoff
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stage=/var/lib/acc-gh-runner/bootstrap-telegram
          test ! -e "$stage"
          mkdir -m 700 "$stage"
          python3 operations/infra/vps/f32/prepare_channel.py pack approved-source "$stage/source.json"
          for name in prepare_channel.py prepare_fixed_release.sh acc-prepare-fixed.service acc-prepare-fixed.path enable_prepare_channel.sh; do
            cp "operations/infra/vps/f32/$name" "$stage/$name"
          done
          echo BOOTSTRAP_FILES_READY
          for attempt in $(seq 1 900); do
            test ! -f "$stage/operator.ready" || break
            sleep 2
          done
          test -f "$stage/operator.ready"
          printf 'prepare-316dc16\n' > "$stage/request"
          for attempt in $(seq 1 2400); do
            receipt=/var/lib/acc-telegram-prepare-receipt/status
            if test -f "$receipt"; then
              if grep -q FAILED "$receipt" || grep -q Reconciliation "$receipt"; then
                cat "$receipt"
                exit 1
              fi
              if python3 -c 'import json,sys;p=json.load(open(sys.argv[1]));assert p["revision"]=="316dc1615dea224bcf4bd595d87048d19820bd21";assert p["go_live"] is False;print(p)' "$receipt" 2>/dev/null; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'Preparation unconfirmed; inspect protected operator log. Do not retry blindly.'
          exit 1
