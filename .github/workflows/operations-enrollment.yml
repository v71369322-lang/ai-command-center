name: Stage reviewed operations enrollment source only
on:
  push:
    branches: [ops/bounded-vps-enrollment]
permissions:
  contents: read
concurrency:
  group: operations-enrollment
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline tests, no VPS access
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen
          .venv/bin/ruff check src/command_center/operations_channel.py infra/vps/operations infra/vps/tests/test_operations_channel.py
          .venv/bin/pytest infra/vps/tests/test_operations_channel.py -q
  stage:
    needs: validate
    if: contains(github.event.head_commit.message, '[prepare-ops-enrollment]')
    runs-on: [acc-bootstrap-only]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: operations-enrollment
          fetch-depth: 0
          persist-credentials: false
      - name: Report non-secret source availability; no installation
        working-directory: operations-enrollment
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum infra/vps/operations/enroll.py
          echo OPERATIONS_ENROLLMENT_SOURCE_STAGED_ONLY
